# Publish to npm when a version tag is pushed
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for npm provenance
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Fail fast: a mistyped tag should not cost a full test+build+E2E run.
      - name: Verify git tag matches all package versions
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          for PKG in packages/core packages/vue packages/react; do
            PKG_VERSION=$(node -p "require('./${PKG}/package.json').version")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag v${TAG_VERSION} != ${PKG} version ${PKG_VERSION}"; exit 1
            fi
          done

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build library and docs
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Publish all packages
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
